<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Logo Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .logo-card {
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), 
                  box-shadow 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.24s ease;
    }
    .logo-card:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.08), 0 4px 10px -2px rgba(0, 0, 0, 0.04);
      border-color: #cbd5e1;
    }
    .logo-card:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body class="bg-neutral-100/70 text-neutral-800 antialiased min-h-screen py-10 px-4 sm:px-6 lg:px-8 flex flex-col justify-center items-center">

  <main class="w-full max-w-6xl mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

      <!-- ========================================================
           TILE 1 (ROW 1, COL 1): GOOGLE ANTIGRAVITY
           ======================================================== -->
      <div class="logo-card group relative h-[140px] bg-white rounded-2xl border border-neutral-200/90 shadow-sm p-5 flex items-center justify-center cursor-pointer select-none overflow-hidden"
           title="Click to copy SVG"
           data-name="Google Antigravity">
        <svg class="max-w-[90%] max-h-[80px] w-auto h-auto transition-transform duration-300 group-hover:scale-105" viewBox="0 0 540 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="agPeakGrad" x1="0%" y1="100%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2D72F6" />
              <stop offset="26%" stop-color="#34A853" />
              <stop offset="50%" stop-color="#FBBC04" />
              <stop offset="74%" stop-color="#EA4335" />
              <stop offset="100%" stop-color="#4285F4" />
            </linearGradient>
          </defs>

          <!-- Ambient Blue Particles around the card -->
          <g opacity="0.65" fill="#3B82F6">
            <circle cx="28" cy="22" r="1.5" />
            <circle cx="48" cy="14" r="1" />
            <circle cx="24" cy="46" r="1.2" />
            <circle cx="14" cy="74" r="1.4" opacity="0.4" />
            <circle cx="38" cy="98" r="1.8" />
            <circle cx="58" cy="112" r="1.2" />
            <circle cx="504" cy="16" r="1.8" />
            <circle cx="522" cy="28" r="1.4" />
            <circle cx="492" cy="38" r="2" />
            <circle cx="516" cy="62" r="1.6" />
            <circle cx="478" cy="92" r="1.2" />
            <circle cx="502" cy="106" r="1.5" />
            <circle cx="526" cy="88" r="1.2" />
          </g>

          <!-- Google Antigravity Chevron Peak -->
          <g transform="translate(24, 25)">
            <path d="M 6 62 C 10 46, 21 16, 33 5 C 38 0.5, 43 0.5, 48 5 C 60 16, 71 46, 75 62 C 75.8 65, 72.8 67, 70.2 65 C 64 60, 52 32, 45 20 C 43 16.5, 38 16.5, 36 20 C 29 32, 17 60, 10.8 65 C 8.2 67, 5.2 65, 6 62 Z"
                  fill="url(#agPeakGrad)" />
          </g>

          <!-- Typography: "Google Antigravity" -->
          <text x="126" y="73" fill="#1F2124" font-size="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="-0.5">Google Antigravity</text>
        </svg>
        <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 absolute top-2 right-3 text-[10px] font-semibold tracking-wider uppercase text-neutral-400 bg-neutral-100 px-2 py-0.5 rounded">Copy SVG</span>
      </div>

      <!-- ========================================================
           TILE 2 (ROW 1, COL 2): ERPYAS
           ======================================================== -->
      <div class="logo-card group relative h-[140px] bg-white rounded-2xl border border-neutral-200/90 shadow-sm p-4 flex items-center justify-center cursor-pointer select-none overflow-hidden"
           title="Click to copy SVG"
           data-name="ERPYAS">
        <svg class="max-w-[90%] max-h-[105px] w-auto h-auto transition-transform duration-300 group-hover:scale-105" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="erpyasBorder" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00C4F4" />
              <stop offset="40%" stop-color="#2D72F6" />
              <stop offset="100%" stop-color="#6F4BF2" />
            </linearGradient>
            <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#EBF9FE" />
              <stop offset="100%" stop-color="#BAEEFC" />
            </linearGradient>
            <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#83E7F8" />
              <stop offset="100%" stop-color="#C2F1FC" />
            </linearGradient>
            <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#DFC4FA" />
              <stop offset="100%" stop-color="#C697F7" />
            </linearGradient>
            <radialGradient id="cyanCenterGlow" cx="50%" cy="40%" r="50%">
              <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
              <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- Squircle Gradient Outer Ring -->
          <rect x="7" y="7" width="186" height="186" rx="48" fill="#FFFFFF" stroke="url(#erpyasBorder)" stroke-width="7" />

          <!-- Isometric Cube Assembly -->
          <g transform="translate(100, 102)">
            <!-- Outer Cube Subtle Rim -->
            <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="none" stroke="#D3D7DF" stroke-width="3" stroke-linejoin="round" />
            <!-- Top Face -->
            <polygon points="0,-46 40,-23 0,0 -40,-23" fill="url(#cubeTop)" />
            <!-- Left Face -->
            <polygon points="-40,-23 0,0 0,46 -40,23" fill="url(#cubeLeft)" />
            <!-- Right Face -->
            <polygon points="0,0 40,-23 40,23 0,46" fill="url(#cubeRight)" />
            <!-- Inner Cyan Ambient Glow -->
            <ellipse cx="0" cy="-2" rx="24" ry="18" fill="url(#cyanCenterGlow)" />
            <!-- High-Contrast Bold 'Y' Monogram -->
            <path d="M -18 -26 L 0 0 L 18 -26 M 0 0 L 0 28" fill="none" stroke="#050505" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </svg>
        <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 absolute top-2 right-3 text-[10px] font-semibold tracking-wider uppercase text-neutral-400 bg-neutral-100 px-2 py-0.5 rounded">Copy SVG</span>
      </div>

      <!-- ========================================================
           TILE 5 (ROW 2, COL 2): ERPNEXT [E] RPNext
           ======================================================== -->
      <div class="logo-card group relative h-[140px] bg-white rounded-2xl border border-neutral-200/90 shadow-sm p-5 flex items-center justify-center cursor-pointer select-none overflow-hidden"
           title="Click to copy SVG"
           data-name="ERPNext">
        <svg class="max-w-[90%] max-h-[72px] w-auto h-auto transition-transform duration-300 group-hover:scale-105" viewBox="0 0 460 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- ERPNext Blue Icon Squircle with White 'ē' Macron Symbol -->
          <rect x="8" y="10" width="100" height="100" rx="18" fill="#0089FF" />
          
          <!-- White Macron Bar -->
          <rect x="28" y="32" width="60" height="13" rx="2" fill="#FFFFFF" />
          
          <!-- White Block 'E' -->
          <path d="M 28 55 H 88 V 68 H 47 V 79 H 88 V 92 H 28 Z" fill="#FFFFFF" />

          <!-- "RPNext" Text in Grey matching Screenshot -->
          <text x="128" y="87" fill="#8B96A5" font-size="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" letter-spacing="-1.5">RPNext</text>
        </svg>
        <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 absolute top-2 right-3 text-[10px] font-semibold tracking-wider uppercase text-neutral-400 bg-neutral-100 px-2 py-0.5 rounded">Copy SVG</span>
      </div>

      <!-- ========================================================
           TILE 6 (ROW 2, COL 3): GEMINI
           ======================================================== -->
      <div class="logo-card group relative h-[140px] bg-white rounded-2xl border border-neutral-200/90 shadow-sm p-6 flex items-center justify-center cursor-pointer select-none overflow-hidden"
           title="Click to copy SVG"
           data-name="Gemini">
        <svg class="max-w-[90%] max-h-[64px] w-auto h-auto transition-transform duration-300 group-hover:scale-105" viewBox="0 0 460 110" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="geminiStarGrad" x1="15%" y1="15%" x2="85%" y2="85%">
              <stop offset="0%" stop-color="#EA4335" />
              <stop offset="30%" stop-color="#1B72E8" />
              <stop offset="68%" stop-color="#1A73E8" />
              <stop offset="100%" stop-color="#34A853" />
            </linearGradient>
            <radialGradient id="geminiYellowGlow" cx="22%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FBBC04" stop-opacity="1" />
              <stop offset="100%" stop-color="#FBBC04" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- 4-pointed Gemini Spark Symbol -->
          <g transform="translate(18, 10)">
            <path d="M 44 4 C 44 26 28 42 4 44 C 28 46 44 62 44 84 C 44 62 60 46 84 44 C 60 42 44 26 44 4 Z" fill="url(#geminiStarGrad)" />
            <path d="M 44 4 C 44 26 28 42 4 44 C 28 46 44 62 44 84 C 44 62 60 46 84 44 C 60 42 44 26 44 4 Z" fill="url(#geminiYellowGlow)" style="mix-blend-mode: screen;" />
          </g>

          <!-- Gemini Wordmark -->
          <text x="132" y="70" fill="#1F2124" font-size="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" letter-spacing="-1">Gemini</text>
        </svg>
        <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 absolute top-2 right-3 text-[10px] font-semibold tracking-wider uppercase text-neutral-400 bg-neutral-100 px-2 py-0.5 rounded">Copy SVG</span>
      </div>

      <!-- ========================================================
           TILE 7 (ROW 3, COL 1): GOOGLE PLAY BADGE
           ======================================================== -->
      <div class="logo-card group relative h-[140px] bg-white rounded-2xl border border-neutral-200/90 shadow-sm p-4 flex items-center justify-center cursor-pointer select-none overflow-hidden"
           title="Click to copy SVG"
           data-name="Google Play Badge">
        <svg class="max-w-[92%] max-h-[76px] w-auto h-auto transition-transform duration-300 group-hover:scale-105" viewBox="0 0 540 160" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Black Pill Container with fine silver border -->
          <rect x="4" y="4" width="532" height="152" rx="28" fill="#000000" stroke="#A6A6A6" stroke-width="2" />

          <!-- Google Play Multi-colored Emblem -->
          <g transform="translate(42, 30)">
            <defs>
              <linearGradient id="gpBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00C3FF" />
                <stop offset="100%" stop-color="#0178FF" />
              </linearGradient>
              <linearGradient id="gpRed" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FF3A44" />
                <stop offset="100%" stop-color="#C31162" />
              </linearGradient>
              <linearGradient id="gpYellow" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFE000" />
                <stop offset="100%" stop-color="#FFB900" />
              </linearGradient>
              <linearGradient id="gpGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00E676" />
                <stop offset="100%" stop-color="#00A74D" />
              </linearGradient>
            </defs>

            <!-- Blue Base Triangle -->
            <path d="M 4 3.5 C 2.4 5.2 1.5 7.8 1.5 11.2 L 1.5 88.8 C 1.5 92.2 2.4 94.8 4 96.5 L 4.5 97 L 53.5 48.5 L 53.5 48 L 4 3.5 Z" fill="url(#gpBlue)" />
            <!-- Red Bottom Fold -->
            <path d="M 69.8 64.8 L 53.5 48.5 L 4 97 C 6 98.8 9 99.2 12.5 97.2 L 69.8 64.8 Z" fill="url(#gpRed)" />
            <!-- Green Top Fold -->
            <path d="M 69.8 35.2 L 12.5 2.8 C 9 0.8 6 1.2 4 3 L 53.5 51.5 L 69.8 35.2 Z" fill="url(#gpGreen)" />
            <!-- Yellow Tip Diamond -->
            <path d="M 69.8 35.2 L 53.5 48 L 69.8 64.8 L 88.5 54.2 C 93.5 51.3 93.5 46.7 88.5 43.8 L 69.8 35.2 Z" fill="url(#gpYellow)" />
          </g>

          <!-- GET IT ON Sub-label -->
          <text x="168" y="55" fill="#FFFFFF" font-size="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" letter-spacing="2">GET IT ON</text>

          <!-- Google Play Primary Label -->
          <text x="168" y="118" fill="#FFFFFF" font-size="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" letter-spacing="-0.5">Google Play</text>
        </svg>
        <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 absolute top-2 right-3 text-[10px] font-semibold tracking-wider uppercase text-neutral-400 bg-neutral-100 px-2 py-0.5 rounded">Copy SVG</span>
      </div>

      <!-- ========================================================
           TILE 9 (ROW 3, COL 3): LINKEDIN
           ======================================================== -->
      <div class="logo-card group relative h-[140px] bg-white rounded-2xl border border-neutral-200/90 shadow-sm p-4 flex items-center justify-center cursor-pointer select-none overflow-hidden"
           title="Click to copy SVG"
           data-name="LinkedIn">
        <svg class="max-w-[90%] max-h-[96px] w-auto h-auto transition-transform duration-300 group-hover:scale-105" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- LinkedIn Official Blue Rounded Squircle -->
          <rect width="200" height="200" rx="42" fill="#0A66C2" />

          <!-- White "in" Glyph -->
          <g fill="#FFFFFF">
            <!-- 'i' dot circle -->
            <circle cx="45.5" cy="45.5" r="17.5" />
            <!-- 'i' vertical stem -->
            <rect x="30.5" y="75" width="30" height="95" rx="1.5" />
            <!-- 'n' arched letterform -->
            <path d="M 79 75 H 108 V 88 C 112.5 80 123 72.5 139 72.5 C 164 72.5 172 88.5 172 113 V 170 H 142 V 118 C 142 105 137 98 126 98 C 115 98 109 106 109 119 V 170 H 79 V 75 Z" />
          </g>
        </svg>
        <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 absolute top-2 right-3 text-[10px] font-semibold tracking-wider uppercase text-neutral-400 bg-neutral-100 px-2 py-0.5 rounded">Copy SVG</span>
      </div>

    </div>
  </main>

  <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-neutral-900/90 backdrop-blur-md text-white px-5 py-2.5 rounded-full shadow-xl flex items-center space-x-2.5 opacity-0 pointer-events-none transition-all duration-300 transform translate-y-3 z-50 text-sm font-medium">
    <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
    </svg>
    <span id="toastText">SVG copied to clipboard</span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.logo-card');
      const toast = document.getElementById('toastNotification');
      const toastText = document.getElementById('toastText');
      let toastTimeout = null;

      function showToast(message) {
        if (toastTimeout) clearTimeout(toastTimeout);
        toastText.textContent = message;
        toast.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');
        toast.classList.add('opacity-100', 'translate-y-0');

        toastTimeout = setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none');
        }, 2200);
      }

      function copyTextFallback(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          document.execCommand('copy');
          showToast('SVG copied to clipboard');
        } catch (err) {
          showToast('Failed to copy');
        }
        document.body.removeChild(textarea);
      }

      cards.forEach(card => {
        card.addEventListener('click', () => {
          const svgElement = card.querySelector('svg');
          if (!svgElement) return;

          const serializer = new XMLSerializer();
          let svgString = serializer.serializeToString(svgElement);
          svgString = svgString.replace(/\s*class="[^"]*"/g, '');

          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(svgString)
              .then(() => showToast('SVG copied to clipboard'))
              .catch(() => copyTextFallback(svgString));
          } else {
            copyTextFallback(svgString);
          }

          card.classList.add('ring-2', 'ring-neutral-400');
          setTimeout(() => {
            card.classList.remove('ring-2', 'ring-neutral-400');
          }, 250);
        });
      });
    });
  </script>
</body>
</html>
